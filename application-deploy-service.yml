apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-deployment
  labels:
    app: bank
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bank
  template:
    metadata:
      labels:
        app: bank
    spec:
      containers:
      - name: cont1
        image: kunaljadhav1625/insurance-image:latest
        ports:
          - containerPort: 80

        # Health Probes
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15   # Wait 15s before first check
          periodSeconds: 10         # Check every 10s
          failureThreshold: 3       # Restart after 3 failed checks

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5    # Start checking after 5s
          periodSeconds: 5          # Check every 5s
          failureThreshold: 2       # Mark unready after 2 failed checks

        startupProbe:
          httpGet:
            path: /
            port: 80
          failureThreshold: 30      # Give app up to 30 failures
          periodSeconds: 10         # before considering startup failed

---
apiVersion: v1
kind: Service
metadata:
  name: insurance-service
spec:
  type: NodePort
  selector:
    app: bank
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31433
